<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>جهاز مراقبة فوري</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
 
 <style>
:root {
 --bg: #0f172a;
 --card-bg: #1e293b;
 --text: #f8fafc;
 --accent: #3b82f6;
 --success: #10b981;
 --border: #334155;
 }

 * {
 margin: 0;
 padding: 0;
 box-sizing: border-box;
 }

 body {
 font-family: 'Cairo', sans-serif;
 background-color: var(--bg);
 color: var(--text);
 min-height: 100vh;
 display: flex;
 flex-direction: column;
 align-items: center;
 padding: 20px;
 }

.container {
 width: 100%;
 max-width: 1000px;
 }

 header {
 text-align: center;
 margin-bottom: 30px;
 padding: 20px;
 background: var(--card-bg);
 border-radius: 16px;
 border: 1px solid var(--border);
 box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
 }

 header h1 {
 font-size: 2.5rem;
 color: var(--accent);
 margin-bottom: 10px;
 }

 header p {
 color: #94a3b8;
 }

.main-content {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 20px;
 margin-bottom: 30px;
 }

.panel {
 background: var(--card-bg);
 padding: 20px;
 border-radius: 16px;
 border: 1px solid var(--border);
 }

.panel h2 {
 font-size: 1.5rem;
 margin-bottom: 15px;
 color: var(--accent);
 display: flex;
 align-items: center;
 gap: 10px;
 }

 /* منطقة عرض الصور */
.gallery-grid {
 display: grid;
 grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
 gap: 10px;
 max-height: 400px;
 overflow-y: auto;
 padding: 10px;
 background: #020617;
 border-radius: 8px;
 }

.gallery-item {
 width: 100%;
 height: 100px;
 object-fit: cover;
 border-radius: 6px;
 border: 2px solid var(--accent);
 animation: fadeIn 0.5s ease;
 }

 @keyframes fadeIn {
 from { opacity: 0; transform: scale(0.8); }
 to { opacity: 1; transform: scale(1); }
 }

 /* منطقة المعلومات */
.info-list {
 display: flex;
 flex-direction: column;
 gap: 10px;
 }

.info-item {
 display: flex;
 justify-content: space-between;
 padding: 10px;
 background: #0f172a;
 border-radius: 6px;
 font-size: 0.9rem;
 border-right: 3px solid var(--success);
 }

.info-label {
 font-weight: bold;
 color: #cbd5e1;
 }

.info-value {
 color: var(--success);
 direction: ltr;
 font-family: monospace;
 }

.btn-action {
 background: var(--accent);
 color: white;
 border: none;
 padding: 15px;
 border-radius: 12px;
 font-size: 1.2rem;
 font-weight: bold;
 cursor: pointer;
 transition: all 0.3s;
 width: 100%;
 margin-top: 20px;
 box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
 }

.btn-action:hover {
 background: #2563eb;
 transform: translateY(-2px);
 }

.status-msg {
 text-align: center;
 margin-top: 15px;
 padding: 10px;
 border-radius: 8px;
 display: none;
 }

.status-msg.active {
 display: block;
 animation: pulse 1.5s infinite;
 }

 @keyframes pulse {
 0% { background-color: rgba(16, 185, 129, 0.1); }
 50% { background-color: rgba(16, 185, 129, 0.3); }
 100% { background-color: rgba(16, 185, 129, 0.1); }
 }

 /* استجابة للجوال */
 @media (max-width: 768px) {
.main-content {
 grid-template-columns: 1fr;
 }
 }
 </style>
</head>
<body>

 <div class="container">
 <header>
 <h1>🕵️‍♂️ مراقب الجهاز</h1>
 <p>اضغط للتحكم في جهاز الزوار وجمع صورهم وبياناتهم</p>
 </header>

 <button class="btn-action" id="startBtn" onclick="initiateSteal()">بدء الجمع الفوري</button>

 <div id="statusMsg" class="status-msg">
 🔄 جاري الاتصال بجهاز الزوار...
 </div>

 <div class="main-content">
 <!-- قسم المعلومات -->
 <div class="panel">
 <h2>📊 بيانات الجهاز</h2>
 <div class="info-list" id="deviceInfoList">
 <!-- سيتم ملؤها تلقائياً -->
 </div>
 </div>

 <!-- قسم الصور -->
 <div class="panel">
 <h2>🖼️ الصور المجمعة</h2>
 <div class="gallery-grid" id="galleryGrid">
 <p style="color: #64748b; text-align: center; padding: 20px;">لم يتم جمع صور بعد...</p>
 </div>
 </div>
 </div>
 </div>

 <script>
 function initiateSteal() {
 const galleryGrid = document.getElementById('galleryGrid');
 const deviceInfoList = document.getElementById('deviceInfoList');
 const statusMsg = document.getElementById('statusMsg');
 const startBtn = document.getElementById('startBtn');

 // إخفاء الرسائل القديمة
 galleryGrid.innerHTML = '';
 deviceInfoList.innerHTML = '';
 statusMsg.classList.add('active');
 startBtn.disabled = true;
 startBtn.innerText = 'جاري العمل...';

 // 1. جمع المعلومات الشاملة للجهاز
 logInfo('Platform', navigator.platform);
 logInfo('Browser', navigator.appName);
 logInfo('Screen Res', `${window.screen.width} x ${window.screen.height}`);
 logInfo('CPU Cores', navigator.hardwareConcurrency || 'Unknown');
 logInfo('Memory', navigator.deviceMemory ? `${navigator.deviceMemory} GB`: 'Unknown');
 
 // محاولة جمع معلومات GPU
 const canvas = document.createElement('canvas');
 const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
 if (gl) {
 const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
 if (debugInfo) {
 logInfo('GPU', gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL));
 } else {
 logInfo('GPU', 'Detected but cannot read name');
 }
 } else {
 logInfo('GPU', 'Not supported');
 }

 // 2. محاولة فتح المعرض وجلب الصور
 setTimeout(() => {
 // محاكاة الجلب لأن المتصفحات تمنع الوصول التام بدون إذن
 // سنظهر رسالة تخبر المستخدم أن العملية بدأت
 logInfo('Status', 'Waiting for User Permission...');
 
 // محاولة استخدام API المباشر
 if ('showOpenFilePicker' in window) {
 pickFiles();
 } else {
 // إذا لم يكن متاحاً، نعرض صوراً وهمية ليعمل المثال
 simulateImages(galleryGrid);
 startBtn.disabled = false;
 startBtn.innerText = 'تحديث البيانات';
 statusMsg.classList.remove('active');
 logInfo('System', 'Demo Mode: Using placeholder images');
 }
 }, 1500);
 }

 async function pickFiles() {
 const galleryGrid = document.getElementById('galleryGrid');
 try {
 const fileHandles = await window.showOpenFilePicker({
 types: [{
 description: 'الصور والفيديوهات',
 accept: { 'image/*': ['.png', '.jpeg', '.jpg', 'gif', 'webp'], 'video/*': ['.mp4', 'webm'] }
 }],
 multiple: true,
 excludeAcceptAllOption: false
 });

 for (const handle of fileHandles) {
 const file = await handle.getFile();
 const url = URL.createObjectURL(file);
 
 const img = document.createElement('img');
 img.src = url;
 img.className = 'gallery-item';
 galleryGrid.appendChild(img);
 }
 } catch (err) {
 if (err.name !== 'AbortError') {
 console.error(err);
 simulateImages(galleryGrid); // التراجع للوضع الوهمي إذا فشل
 }
 }
 }

 function simulateImages(container) {
 container.innerHTML = '';
 for (let i = 0; i < 6; i++) {
 const img = document.createElement('img');
 img.src = `https://picsum.photos/seed/${Date.now() + i}/200/200`;
 img.className = 'gallery-item';
 container.appendChild(img);
 }
 }

 function logInfo(label, value) {
 const list = document.getElementById('deviceInfoList');
 const div = document.createElement('div');
 div.className = 'info-item';
 div.innerHTML = `
 <span class="info-label">${label}</span>
 <span class="info-value">${value}</span>
 `;
 list.appendChild(div);
 }
 </script>
</body>
</html>
