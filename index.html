<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DualDraw - لوحة الرسم المزدوجة المباشرة</title>
    <!-- مكتبة PeerJS للاتصال المباشر بين الأجهزة -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* شريط التحكم العلوي */
        header {
            background: #1e1e1e;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            z-index: 10;
        }

        .logo {
            font-weight: bold;
            font-size: 1.2rem;
            color: #00d2ff;
        }

        .connection-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #2a2a2a;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ff4d4d; /* أحمر = غير متصل */
        }

        .status-dot.connected {
            background-color: #00e676; /* أخضر = متصل */
        }

        input[type="text"] {
            background: #121212;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: center;
            width: 130px;
        }

        button {
            background: #00d2ff;
            color: #121212;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }

        button:hover {
            opacity: 0.9;
        }

        /* شريط أدوات الرسم */
        .toolbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .color-picker {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        .color-picker::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker::-webkit-color-swatch {
            border: 2px solid #fff;
            border-radius: 50%;
        }

        .range-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
        }

        /* منطقة الرسم */
        .canvas-container {
            flex: 1;
            position: relative;
            background: #0a0a0a;
            cursor: crosshair;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            touch-action: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">DualDraw ✏️</div>
        
        <div class="connection-box">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText" style="font-size: 0.8rem;">جاري الإعداد...</span>
            <input type="text" id="peerIdInput" placeholder="معرف الغرفة" readonly>
            <button id="copyBtn">نسخ المعرف</button>
            <input type="text" id="targetIdInput" placeholder="أدخل معرف الطرف الآخر">
            <button id="connectBtn">اتصال</button>
        </div>
    </header>

    <div class="canvas-container">
        <canvas id="paintCanvas"></canvas>
    </div>

    <div class="toolbar">
        <input type="color" id="colorPicker" class="color-picker" value="#00d2ff">
        
        <div class="range-wrap">
            <label for="brushSize">الحجم:</label>
            <input type="range" id="brushSize" min="2" max="40" value="5">
        </div>

        <button id="clearBtn" style="background: #ff4d4d; color: #fff;">مسح الشاشة</button>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');
        const brushSize = document.getElementById('brushSize');
        const clearBtn = document.getElementById('clearBtn');
        
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const peerIdInput = document.getElementById('peerIdInput');
        const copyBtn = document.getElementById('copyBtn');
        const targetIdInput = document.getElementById('targetIdInput');
        const connectBtn = document.getElementById('connectBtn');

        let peer = null;
        let conn = null;
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // ضبط أبعاد اللوحة حسب الشاشة
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // إعداد PeerJS لاتصال الأجهزة من أي مكان
        function initPeer() {
            peer = new Peer();

            peer.on('open', (id) => {
                peerIdInput.value = id;
                statusText.innerText = 'جاهز للاتصال';
            });

            // استقبال الاتصال من الجهاز الثاني
            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
            });
        }

        // إعداد أحداث التفاعل عند نجاح الاتصال
        function setupConnection() {
            statusDot.classList.add('connected');
            statusText.innerText = 'متصل الآن!';

            conn.on('data', (data) => {
                if (data.type === 'draw') {
                    drawOnCanvas(data.x1, data.y1, data.x2, data.y2, data.color, data.size, false);
                } else if (data.type === 'clear') {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            });

            conn.on('close', () => {
                statusDot.classList.remove('connected');
                statusText.innerText = 'انقطع الاتصال';
            });
        }

        // الاتصال بجهاز آخر عن طريق الـ ID
        connectBtn.addEventListener('click', () => {
            const targetId = targetIdInput.value.trim();
            if (targetId) {
                conn = peer.connect(targetId);
                setupConnection();
            }
        });

        // نسخ الـ ID للمشاركة
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(peerIdInput.value);
            alert('تم نسخ معرف الغرفة! أرسله للطرف الثاني للاتصال.');
        });

        // وظيفة الرسم
        function drawOnCanvas(x1, y1, x2, y2, color, size, emit = true) {
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            // إرسال بيانات الرسم للطرف الآخر فوراً
            if (emit && conn && conn.open) {
                conn.send({
                    type: 'draw',
                    x1: x1 / canvas.width,  // إرسال نسب مئوية لضمان التوافق مع اختلاف أحجام الشاشات
                    y1: y1 / canvas.height,
                    x2: x2 / canvas.width,
                    y2: y2 / canvas.height,
                    color: color,
                    size: size
                });
            }
        }

        // استقبال الإحداثيات والتحويل التناسبي للشاشة المحلية
        function handleDrawFromPeer(x1, y1, x2, y2, color, size) {
            drawOnCanvas(x1 * canvas.width, y1 * canvas.height, x2 * canvas.width, y2 * canvas.height, color, size, false);
        }

        // أحداث الماوس واللمس
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            drawOnCanvas(lastX, lastY, pos.x, pos.y, colorPicker.value, brushSize.value, true);
            lastX = pos.x;
            lastY = pos.y;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        // مسح اللوحة
        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (conn && conn.open) {
                conn.send({ type: 'clear' });
            }
        });

        // تشغيل الاتصال
        initPeer();
    </script>
</body>
</html>
