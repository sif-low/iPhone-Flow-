<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DualDraw Studio - Pro Edition</title>
    <!-- مكتبة PeerJS للاتصال المباشر P2P -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #07080a;
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* خلفية نيون أورورا سينمائية */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 15% 20%, rgba(0, 210, 255, 0.12) 0%, transparent 45%),
                        radial-gradient(circle at 85% 80%, rgba(255, 0, 127, 0.12) 0%, transparent 45%),
                        radial-gradient(circle at 50% 50%, rgba(112, 0, 255, 0.08) 0%, transparent 60%);
            pointer-events: none;
        }

        /* شريط علوي أنيق ومتجاوب */
        header {
            position: relative;
            z-index: 10;
            background: rgba(15, 16, 22, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo {
            font-weight: 900;
            font-size: 1.15rem;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #00d2ff, #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.72rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff3b30;
            box-shadow: 0 0 10px #ff3b30;
            transition: all 0.3s ease;
        }

        .status-dot.connected {
            background-color: #34c759;
            box-shadow: 0 0 10px #34c759;
        }

        .connection-controls {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .input-group {
            display: flex;
            flex: 1;
            gap: 4px;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 0.78rem;
            outline: none;
            transition: 0.2s;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.3);
        }

        button {
            background: linear-gradient(135deg, #00d2ff, #0072ff);
            color: #ffffff;
            border: none;
            padding: 7px 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.78rem;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:active {
            transform: scale(0.94);
        }

        button.btn-secondary {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* منطقة الرسم المستقبلي */
        .canvas-container {
            flex: 1;
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            background-color: #0b0c10;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: 28px 28px;
            overflow: hidden;
            cursor: crosshair;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            touch-action: none;
        }

        /* شريط الأدوات السفلي المرتفع المتناسق للهواتف */
        .toolbar {
            position: absolute;
            bottom: calc(25px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(15, 16, 22, 0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 8px 14px;
            border-radius: 35px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
            max-width: 96vw;
        }

        .preset-colors {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .color-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            border: 2px solid transparent;
        }

        .color-dot:active, .color-dot.active {
            transform: scale(1.25);
            border-color: #ffffff;
        }

        .color-picker-wrapper {
            position: relative;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            flex-shrink: 0;
        }

        .color-picker {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            cursor: pointer;
            border: none;
        }

        .tool-select {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 8px;
            border-radius: 15px;
            font-size: 0.72rem;
            outline: none;
        }

        .range-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        input[type="range"] {
            width: 55px;
            accent-color: #00d2ff;
            cursor: pointer;
        }

        button.btn-danger {
            background: linear-gradient(135deg, #ff3b30, #ff2d55);
            border-radius: 15px;
            padding: 5px 12px;
            font-size: 0.75rem;
        }

        /* إشعار التنبيه المباشر */
        .toast {
            position: absolute;
            top: 110px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(0, 210, 255, 0.9);
            color: #000;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.75rem;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>
    <div class="toast" id="toast">تم النسخ بنجاح!</div>

    <header>
        <div class="header-top">
            <div class="logo">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>
                DualDraw Studio
            </div>
            <div class="status-badge">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">جاهز للربط</span>
            </div>
        </div>

        <div class="connection-controls">
            <div class="input-group">
                <input type="text" id="peerIdInput" placeholder="معرف غرفتك" readonly>
                <button class="btn-secondary" id="copyBtn">نسخ</button>
            </div>
            <div class="input-group">
                <input type="text" id="targetIdInput" placeholder="معرف الطرف الثاني">
                <button id="connectBtn">اتصال</button>
            </div>
        </div>
    </header>

    <div class="canvas-container">
        <canvas id="paintCanvas"></canvas>
    </div>

    <div class="toolbar">
        <div class="preset-colors">
            <div class="color-dot active" style="background: #00d2ff;" data-color="#00d2ff"></div>
            <div class="color-dot" style="background: #ff007f;" data-color="#ff007f"></div>
            <div class="color-dot" style="background: #34c759;" data-color="#34c759"></div>
            <div class="color-dot" style="background: #ffcc00;" data-color="#ffcc00"></div>
            <div class="color-dot" style="background: #ffffff;" data-color="#ffffff"></div>
        </div>

        <div class="color-picker-wrapper">
            <input type="color" id="colorPicker" class="color-picker" value="#00d2ff">
        </div>

        <select id="brushType" class="tool-select">
            <option value="glow">✨ نيون</option>
            <option value="normal">✏️ عادي</option>
            <option value="eraser">🧽 مسح</option>
        </select>

        <div class="range-wrap">
            <input type="range" id="brushSize" min="2" max="50" value="8">
        </div>

        <button id="clearBtn" class="btn-danger">مسح</button>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');
        const brushSize = document.getElementById('brushSize');
        const brushType = document.getElementById('brushType');
        const clearBtn = document.getElementById('clearBtn');
        const colorDots = document.querySelectorAll('.color-dot');
        const toast = document.getElementById('toast');
        
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const peerIdInput = document.getElementById('peerIdInput');
        const copyBtn = document.getElementById('copyBtn');
        const targetIdInput = document.getElementById('targetIdInput');
        const connectBtn = document.getElementById('connectBtn');

        let peer = null;
        let conn = null;
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let currentColor = '#00d2ff';

        function showToast(msg) {
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function initPeer() {
            peer = new Peer();

            peer.on('open', (id) => {
                peerIdInput.value = id;
                statusText.innerText = 'جاهز للربط';
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
            });

            peer.on('error', (err) => {
                statusText.innerText = 'خطأ بالاتصال';
            });
        }

        function setupConnection() {
            statusDot.classList.add('connected');
            statusText.innerText = 'متصل مباشر!';
            showToast('تم الاتصال بنجاح!');

            conn.on('data', (data) => {
                if (data.type === 'draw') {
                    drawOnCanvas(
                        data.x1 * canvas.width, 
                        data.y1 * canvas.height, 
                        data.x2 * canvas.width, 
                        data.y2 * canvas.height, 
                        data.color, 
                        data.size, 
                        data.mode, 
                        false
                    );
                } else if (data.type === 'clear') {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            });

            conn.on('close', () => {
                statusDot.classList.remove('connected');
                statusText.innerText = 'انقطع الاتصال';
            });
        }

        connectBtn.addEventListener('click', () => {
            const targetId = targetIdInput.value.trim();
            if (targetId) {
                statusText.innerText = 'جاري الربط...';
                conn = peer.connect(targetId);
                setupConnection();
            }
        });

        copyBtn.addEventListener('click', () => {
            if (peerIdInput.value) {
                navigator.clipboard.writeText(peerIdInput.value);
                showToast('تم نسخ المعرف!');
            }
        });

        function drawOnCanvas(x1, y1, x2, y2, color, size, mode, emit = true) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);

            if (mode === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = size * 2.5;
                ctx.stroke();
                ctx.globalCompositeOperation = 'source-over';
            } else if (mode === 'glow') {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = color;
                ctx.lineWidth = size;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowBlur = size * 2.2;
                ctx.shadowColor = color;
                ctx.stroke();
                ctx.shadowBlur = 0;
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = color;
                ctx.lineWidth = size;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowBlur = 0;
                ctx.stroke();
            }

            if (emit && conn && conn.open) {
                conn.send({
                    type: 'draw',
                    x1: x1 / canvas.width,
                    y1: y1 / canvas.height,
                    x2: x2 / canvas.width,
                    y2: y2 / canvas.height,
                    color: color,
                    size: size,
                    mode: mode
                });
            }
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            drawOnCanvas(lastX, lastY, pos.x, pos.y, currentColor, brushSize.value, brushType.value, true);
            lastX = pos.x;
            lastY = pos.y;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        colorDots.forEach(dot => {
            dot.addEventListener('click', () => {
                colorDots.forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                currentColor = dot.dataset.color;
                colorPicker.value = currentColor;
                if(brushType.value === 'eraser') brushType.value = 'glow';
            });
        });

        colorPicker.addEventListener('input', (e) => {
            currentColor = e.target.value;
            colorDots.forEach(d => d.classList.remove('active'));
            if(brushType.value === 'eraser') brushType.value = 'glow';
        });

        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (conn && conn.open) {
                conn.send({ type: 'clear' });
            }
        });

        initPeer();
    </script>
</body>
</html>
